# Builds and publishes the package to PyPI when a release tag (v*) is pushed —
# tags are the public consumption surface; main carries no stability promise.
# Run by hand (workflow_dispatch), it rehearses the release on TestPyPI instead.
#
# Staged: `build` builds the sdist/wheel and runs twine check; `test` runs every
# job in test.yml on the same sha; `publish-test` uploads to TestPyPI; `smoke`
# downloads that upload back and installs it in a clean venv; only then does
# `publish` (tags only) wait for the `pypi` environment's approval and upload to
# PyPI. Uploads use OIDC Trusted Publishing — the trusted publishers are
# registered on pypi.org and test.pypi.org (owner phierceweb, repo pw-foundation,
# workflow publish.yml, environments `pypi` and `testpypi`), so no API-token
# secret lives in the repo.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the publish jobs ask for the OIDC token they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      # Fail fast when the pushed tag doesn't match pyproject's version —
      # a mismatched build otherwise reaches PyPI and 400s on filename reuse.
      - name: verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject version $PKG_VERSION — bump pyproject (and CHANGELOG) before tagging"
            exit 1
          fi
      # TestPyPI also accepts a filename only once, so each rehearsal uploads X.Y.Z.devN.
      - name: stamp a dev version for TestPyPI
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i -E "s/^version = \"([^\"]+)\"$/version = \"\1.dev${GITHUB_RUN_NUMBER}\"/" pyproject.toml
          grep -E '^version = ".+\.dev[0-9]+"$' pyproject.toml
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    uses: ./.github/workflows/test.yml

  # Every run, tags included. skip-existing keeps a re-run of the same tag from
  # failing on TestPyPI's one-upload-per-filename rule.
  publish-test:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # The artifact must come back from the index and install in a clean venv.
  # The wheel is fetched from TestPyPI alone (--no-deps) and its dependencies
  # resolve from PyPI on the install step, so nothing else is taken from
  # TestPyPI.
  smoke:
    needs: [build, publish-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: install the uploaded version back from TestPyPI
        run: |
          set -- dist/pw_foundation-*.whl
          VERSION="${1##*/}"; VERSION="${VERSION#pw_foundation-}"; VERSION="${VERSION%%-*}"
          echo "version under test: $VERSION"
          python -m venv /tmp/smoke
          for attempt in 1 2 3 4 5 6; do
            if /tmp/smoke/bin/pip download -q --no-deps --index-url https://test.pypi.org/simple/ \
                 --dest /tmp/from-index "pw-foundation==$VERSION"; then break; fi
            echo "not on TestPyPI yet (attempt $attempt)"; sleep 20
          done
          set -- /tmp/from-index/pw_foundation-*.whl; [ -f "$1" ]
          /tmp/smoke/bin/pip install -q /tmp/from-index/pw_foundation-*.whl
          /tmp/smoke/bin/pip check
      - name: the installed package answers
        run: |
          cd /tmp
          /tmp/smoke/bin/python -c "import pw_foundation, pw_foundation.log, pw_foundation.exceptions, pw_foundation.config, pw_foundation.guards, pw_foundation.wiring, pw_foundation.doctor; print('imports ok', pw_foundation.__version__)"
          /tmp/smoke/bin/pw-guards --help > /dev/null
          /tmp/smoke/bin/pw-doctor --help > /dev/null
          /tmp/smoke/bin/pw-setup --help > /dev/null
      - name: the wheel ships every doc and rule in the tree
        run: |
          set -- "$GITHUB_WORKSPACE"/src/pw_foundation/docs/*.md; WANT_DOCS=$#
          set -- "$GITHUB_WORKSPACE"/src/pw_foundation/rules/*.md; WANT_RULES=$#
          cd /tmp
          /tmp/smoke/bin/python - "$WANT_DOCS" "$WANT_RULES" <<'EOF'
          import pathlib, sys
          import pw_foundation
          pkg = pathlib.Path(pw_foundation.__file__).parent
          got = (len(list((pkg / "docs").glob("*.md"))), len(list((pkg / "rules").glob("*.md"))))
          want = (int(sys.argv[1]), int(sys.argv[2]))
          print(f"docs/rules installed {got}, in tree {want}")
          sys.exit(0 if got == want else 1)
          EOF

  publish:
    if: github.event_name == 'push'
    needs: [build, test, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
